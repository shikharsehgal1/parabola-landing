<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parabola Trading API — Reference</title>
  <meta name="description" content="API reference for the Parabola Trading API — market data, backtesting, strategies, risk-checked execution, and natural-language trading." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose:#c9982a; --rose-bright:#e8c96a; --sand:#b89240; --sand-bright:#d4aa58;
      --bg:#0b0a07; --panel:#0f0d09; --code:#100e0a; --surface:rgba(255,255,255,0.028); --surface-2:rgba(255,255,255,0.05);
      --border:rgba(255,255,255,0.08); --border-str:rgba(255,255,255,0.15);
      --text:#ede8d8; --text-sec:#9e9278; --text-dim:#5e5438;
      --get:#4ec58a; --post:#e8c96a; --delete:#ef7676; --put:#5aa9e6;
      --nav-h:60px;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:'Syne',system-ui,sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
    a { color:var(--rose-bright); text-decoration:none; }
    code,.mono,pre { font-family:'JetBrains Mono',monospace; }
    ::-webkit-scrollbar { width:9px; height:9px; } ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:9px; }

    .topbar { position:fixed; top:0; left:0; right:0; height:var(--nav-h); z-index:60; display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding:0 clamp(1rem,4vw,2rem); background:rgba(13,12,8,0.9); backdrop-filter:blur(20px) saturate(1.3); border-bottom:1px solid var(--border); }
    .brand { display:flex; align-items:center; gap:10px; color:var(--text); font-family:'Bodoni Moda',Georgia,serif; font-size:1.05rem; font-weight:500; }
    .brand small { font-family:'JetBrains Mono',monospace; font-size:0.64rem; letter-spacing:0.14em; color:var(--rose); text-transform:uppercase; }
    .topbar .links { display:flex; gap:9px; align-items:center; }
    .topbar .links a { font-size:0.8rem; padding:7px 13px; border-radius:9px; color:#d8cfa8; border:1px solid var(--border-str); }
    .topbar .links a:hover { border-color:var(--rose); }
    .topbar .links a.pilot { color:#0b0a07; background:linear-gradient(135deg,var(--rose-bright),var(--rose)); border:none; font-weight:600; }

    .shell { display:grid; grid-template-columns:256px 1fr; max-width:1500px; margin:0 auto; padding-top:var(--nav-h); }
    .sidebar { position:sticky; top:var(--nav-h); align-self:start; height:calc(100vh - var(--nav-h)); overflow-y:auto; padding:20px 12px 80px; border-right:1px solid var(--border); }
    .sidebar .grp { margin-top:14px; }
    .sidebar .grp > div { font-size:0.66rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--sand); font-weight:700; padding:6px 8px; }
    .sidebar a.nav { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:7px; color:var(--text-sec); font-size:0.79rem; }
    .sidebar a.nav:hover { background:var(--surface); color:var(--text); }
    .sidebar a.nav .m { font-size:0.56rem; font-weight:700; padding:2px 5px; border-radius:5px; color:#0b0a07; font-family:'JetBrains Mono',monospace; }

    .main { padding:34px clamp(1rem,3.5vw,3rem) 140px; min-width:0; }
    @media (max-width:900px){ .shell{grid-template-columns:1fr} .sidebar{display:none} }

    .m-get{background:var(--get)} .m-post{background:var(--post)} .m-delete{background:var(--delete)} .m-put{background:var(--put)} .m-patch{background:var(--sand-bright)}

    .hero .eyebrow { font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--rose); letter-spacing:0.1em; }
    .hero h1 { font-family:'Bodoni Moda',Georgia,serif; font-size:clamp(2rem,4vw,2.8rem); font-weight:700; margin:6px 0 10px; }
    .hero p { color:var(--text-sec); max-width:720px; font-size:0.98rem; margin:0; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; margin:26px 0 8px; }
    .card { border:1px solid var(--border); border-radius:14px; background:var(--surface); padding:16px 18px; }
    .card h3 { margin:0 0 4px; font-size:0.98rem; text-transform:capitalize; }
    .card code { font-size:0.72rem; color:var(--rose-bright); }
    .card p { color:var(--text-sec); font-size:0.82rem; margin:8px 0 0; }
    .ratebar { margin-top:22px; padding:14px 18px; border:1px solid var(--border); border-radius:12px; background:var(--surface); color:var(--text-sec); font-size:0.84rem; }
    .ratebar b { color:var(--text); }

    .group-title { font-family:'Bodoni Moda',Georgia,serif; font-size:1.7rem; font-weight:700; margin:52px 0 6px; text-transform:capitalize; scroll-margin-top:calc(var(--nav-h) + 10px); }
    .group-desc { color:var(--text-dim); font-size:0.84rem; margin:0 0 8px; }

    .ep { padding:26px 0 10px; border-top:1px solid var(--border); scroll-margin-top:calc(var(--nav-h) + 10px); }
    .ep-title { font-size:1.18rem; font-weight:600; margin:0 0 8px; }
    .ep-bar { display:flex; align-items:center; gap:11px; padding:10px 14px; border:1px solid var(--border-str); border-radius:11px; background:var(--panel); margin-bottom:6px; }
    .ep-bar .method { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:0.72rem; padding:5px 9px; border-radius:7px; color:#0b0a07; }
    .ep-bar .path { font-family:'JetBrains Mono',monospace; font-size:0.85rem; color:var(--text); word-break:break-all; }
    .ep-grid { display:grid; grid-template-columns:1fr 440px; gap:26px; align-items:start; margin-top:14px; }
    @media (max-width:1180px){ .ep-grid{grid-template-columns:1fr} }
    .ep-desc { color:var(--text-sec); font-size:0.9rem; margin:0 0 8px; }

    .sec-label { font-size:0.66rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--sand); font-weight:700; margin:20px 0 8px; }
    .field { padding:10px 0; border-bottom:1px solid var(--border); }
    .field .fh { display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
    .field .fn { font-family:'JetBrains Mono',monospace; color:var(--text); font-size:0.84rem; }
    .field .ft { font-family:'JetBrains Mono',monospace; color:var(--sand-bright); font-size:0.76rem; }
    .field .req { color:var(--delete); font-size:0.62rem; font-weight:700; letter-spacing:0.04em; }
    .field .opt { color:var(--text-dim); font-size:0.62rem; }
    .field .in { color:var(--text-dim); font-size:0.62rem; text-transform:uppercase; letter-spacing:0.06em; }
    .field .fd { color:var(--text-sec); font-size:0.82rem; margin-top:3px; }

    /* Right code panel */
    .code-col { position:sticky; top:calc(var(--nav-h) + 16px); display:grid; gap:14px; }
    .code-card { border:1px solid var(--border-str); border-radius:12px; background:var(--code); overflow:hidden; }
    .code-card .cc-head { display:flex; align-items:center; gap:4px; padding:8px 10px; border-bottom:1px solid var(--border); background:rgba(255,255,255,0.02); }
    .code-card .cc-head .lbl { font-size:0.64rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); font-weight:700; margin-right:auto; }
    .tab { font-family:'JetBrains Mono',monospace; font-size:0.72rem; padding:4px 9px; border-radius:6px; border:1px solid transparent; background:transparent; color:var(--text-sec); cursor:pointer; }
    .tab.active { color:var(--rose-bright); border-color:var(--border-str); background:rgba(232,201,106,0.08); }
    .copy { font-size:0.66rem; color:var(--text-dim); background:transparent; border:1px solid var(--border); border-radius:6px; padding:3px 8px; cursor:pointer; }
    .copy:hover { color:var(--text); }
    pre { margin:0; padding:14px 15px; overflow-x:auto; font-size:0.76rem; line-height:1.7; color:#d8d0b8; }
    pre[data-lang]{ display:none; } pre[data-lang].show{ display:block; }
    .resp-row { display:flex; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--border); font-size:0.82rem; }
    .status { font-family:'JetBrains Mono',monospace; font-weight:700; } .s2{color:var(--get)} .s4{color:var(--post)} .s5{color:var(--delete)}
    .loading { padding:70px 0; text-align:center; color:var(--text-dim); }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html">
      <svg width="24" height="24" viewBox="0 0 34 34" fill="none"><path d="M4 28 Q17 4 30 28" stroke="#c9982a" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="17" cy="9.5" r="2.2" fill="#c9982a"/></svg>
      Parabola <small>API Reference</small>
    </a>
    <div class="links">
      <a href="index.html">← Landing</a>
      <a class="pilot" href="https://pilot.parabolamarkets.xyz" target="_blank" rel="noopener">Open the Pilot ↗</a>
    </div>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"><div class="loading">Loading API reference…</div></main>
  </div>

  <script>
    const BASE = "https://api.parabolamarkets.xyz";
    const GROUP_META = {
      system: "Health, version, and component/layer status.",
      auth: "Verify wallet / Privy / Supabase identity and mint session tokens.",
      "market-data": "Normalized historical candles and real-time L1/L2 quotes.",
      account: "Cash, margin, buying power, and open positions.",
      orders: "Place, validate, inspect, and cancel risk-checked orders.",
      strategy: "Strategies, indicators, and sandboxed backtesting.",
      "natural-language": "Parse and execute trades from plain English.",
    };
    const MORDER = { get:0, post:1, put:2, patch:3, delete:4 };
    const esc = (s)=>String(s??"").replace(/[&<>]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    const slug = (s)=>s.replace(/[^a-z0-9]+/gi,"-").toLowerCase();
    const refName = (r)=>r?r.split("/").pop():null;

    function typeOf(sc, spec){
      if(!sc) return "any";
      if(sc.$ref) return refName(sc.$ref);
      if(sc.anyOf||sc.oneOf){ const p=(sc.anyOf||sc.oneOf).map(s=>typeOf(s,spec)).filter(t=>t!=="null"); return p.join(" | ")||"any"; }
      if(sc.allOf) return typeOf(sc.allOf[0],spec);
      if(sc.enum) return sc.enum.map(e=>`"${e}"`).join(" | ");
      if(sc.type==="array") return `${typeOf(sc.items,spec)}[]`;
      return sc.type||"object";
    }
    function resolve(sc, spec){ if(!sc) return null; if(sc.$ref) return spec.components.schemas[refName(sc.$ref)]; if(sc.allOf) return resolve(sc.allOf[0],spec); return sc; }

    function example(sc, spec, depth){
      depth=depth||0; if(!sc||depth>4) return null;
      if(sc.example!==undefined) return sc.example;
      if(Array.isArray(sc.examples)&&sc.examples.length) return sc.examples[0];
      if(sc.default!==undefined) return sc.default;
      if(sc.$ref) return example(resolve(sc,spec),spec,depth+1);
      if(sc.allOf) return example(sc.allOf[0],spec,depth+1);
      if(sc.anyOf||sc.oneOf){ const o=(sc.anyOf||sc.oneOf).filter(s=>!(s.type==="null")); return o.length?example(o[0],spec,depth+1):null; }
      if(sc.enum) return sc.enum[0];
      if(sc.type==="array") { const v=example(sc.items,spec,depth+1); return v===null?[]:[v]; }
      if(sc.type==="object"||sc.properties){ const o={}; for(const [k,p] of Object.entries(sc.properties||{})) o[k]=example(p,spec,depth+1); return o; }
      if(sc.type==="integer") return 0;
      if(sc.type==="number") return 0;
      if(sc.type==="boolean") return false;
      if(sc.type==="string") return sc.format==="date-time"?"2026-01-01T00:00:00Z":"string";
      return null;
    }

    function fieldList(sc, spec){
      const r = resolve(sc, spec); if(!r||!r.properties) return "";
      const req = new Set(r.required||[]);
      return Object.entries(r.properties).map(([name,p])=>{
        const rr = resolve(p, spec);
        const desc = p.description || (rr&&rr.description) || "";
        return `<div class="field"><div class="fh"><span class="fn">${esc(name)}</span><span class="ft">${esc(typeOf(p,spec))}</span>${req.has(name)?'<span class="req">REQUIRED</span>':'<span class="opt">optional</span>'}</div>${desc?`<div class="fd">${esc(desc)}</div>`:""}</div>`;
      }).join("");
    }

    function paramList(params, spec){
      return params.map(p=>{
        const desc = p.description||"";
        return `<div class="field"><div class="fh"><span class="fn">${esc(p.name)}</span><span class="in">${esc(p.in)}</span><span class="ft">${esc(typeOf(p.schema,spec))}</span>${p.required?'<span class="req">REQUIRED</span>':'<span class="opt">optional</span>'}</div>${desc?`<div class="fd">${esc(desc)}</div>`:""}</div>`;
      }).join("");
    }

    function buildUrl(path, params, spec){
      let url = path.replace(/\{(\w+)\}/g,(_,n)=> n.endsWith("id")||n.endsWith("_id")?"ord_abc123":"value");
      const q = (params||[]).filter(p=>p.in==="query").map(p=>`${p.name}=${encodeURIComponent(example(p.schema,spec)??"")}`);
      return BASE+url+(q.length?`?${q.join("&")}`:"");
    }

    function codeSamples(method, path, op, spec){
      const url = buildUrl(path, op.parameters, spec);
      const hasBody = !!op.requestBody;
      const body = hasBody ? example(op.requestBody.content["application/json"].schema, spec) : null;
      const bodyStr = hasBody ? JSON.stringify(body, null, 2) : "";
      const M = method.toUpperCase();
      // cURL
      let curl = `curl -X ${M} "${url}" \\\n  -H "Authorization: Bearer $TOKEN"`;
      if(hasBody) curl += ` \\\n  -H "Content-Type: application/json" \\\n  -d '${JSON.stringify(body)}'`;
      // Python
      let py = `import requests\n\nr = requests.${method}(\n  "${url}",\n  headers={"Authorization": "Bearer " + TOKEN}`;
      if(hasBody) py += `,\n  json=${bodyStr.replace(/\n/g,"\n  ")}`;
      py += `,\n)\nprint(r.json())`;
      // JS
      let js = `const r = await fetch("${url}", {\n  method: "${M}",\n  headers: {\n    "Authorization": \`Bearer \${TOKEN}\`` + (hasBody?`,\n    "Content-Type": "application/json"`:"") + `\n  }`;
      if(hasBody) js += `,\n  body: JSON.stringify(${bodyStr.replace(/\n/g,"\n  ")})`;
      js += `\n});\nconst data = await r.json();`;
      return { curl, py, js };
    }

    function responseBlock(op, spec){
      const rows = Object.entries(op.responses||{}).map(([code,r])=>{
        const cls = code[0]==="2"?"s2":code[0]==="4"?"s4":"s5";
        return `<div class="resp-row"><span class="status ${cls}">${esc(code)}</span><span>${esc(r.description||"")}</span></div>`;
      }).join("");
      const ok = op.responses?.["200"]?.content?.["application/json"]?.schema;
      const exJson = ok ? JSON.stringify(example(ok, spec), null, 2) : null;
      return { rows, exJson };
    }

    function renderEndpoint(path, method, op, spec, idx){
      const id = "op-"+slug(method+path);
      const cid = "cc"+idx;
      const { curl, py, js } = codeSamples(method, path, op, spec);
      const { rows, exJson } = responseBlock(op, spec);
      const params = op.parameters||[];
      const bodySchema = op.requestBody?.content?.["application/json"]?.schema;

      const left = `
        ${op.description?`<p class="ep-desc">${esc(op.description)}</p>`:""}
        ${params.length?`<div class="sec-label">Parameters</div>${paramList(params,spec)}`:""}
        ${bodySchema?`<div class="sec-label">Request body — ${esc(typeOf(bodySchema,spec))}</div>${fieldList(bodySchema,spec)}`:""}
        <div class="sec-label">Responses</div>${rows}`;

      const right = `
        <div class="code-col">
          <div class="code-card">
            <div class="cc-head">
              <span class="lbl">Request</span>
              <button class="tab active" onclick="pmTab(this,'${cid}','curl')">cURL</button>
              <button class="tab" onclick="pmTab(this,'${cid}','py')">Python</button>
              <button class="tab" onclick="pmTab(this,'${cid}','js')">JS</button>
              <button class="copy" onclick="pmCopy('${cid}')">Copy</button>
            </div>
            <pre data-lang="curl" class="show" id="${cid}-curl">${esc(curl)}</pre>
            <pre data-lang="py" id="${cid}-py">${esc(py)}</pre>
            <pre data-lang="js" id="${cid}-js">${esc(js)}</pre>
          </div>
          ${exJson?`<div class="code-card"><div class="cc-head"><span class="lbl">Response · 200</span></div><pre class="show">${esc(exJson)}</pre></div>`:""}
        </div>`;

      return `<section class="ep" id="${id}">
        <h3 class="ep-title">${esc(op.summary||path)}</h3>
        <div class="ep-bar"><span class="method m-${method}">${method.toUpperCase()}</span><span class="path">${esc(path)}</span></div>
        <div class="ep-grid"><div>${left}</div>${right}</div>
      </section>`;
    }

    window.pmTab = function(btn, cid, lang){
      btn.parentElement.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
      btn.classList.add("active");
      ["curl","py","js"].forEach(l=>{ const el=document.getElementById(`${cid}-${l}`); if(el) el.classList.toggle("show", l===lang); });
    };
    window.pmCopy = function(cid){
      const shown = document.querySelector(`#${cid}-curl.show, #${cid}-py.show, #${cid}-js.show`);
      if(shown&&navigator.clipboard) navigator.clipboard.writeText(shown.textContent);
    };

    fetch("openapi.json").then(r=>r.json()).then(spec=>{
      const groups = new Map();
      for(const [path,methods] of Object.entries(spec.paths)){
        const ops = Object.entries(methods).sort((a,b)=>(MORDER[a[0]]??9)-(MORDER[b[0]]??9));
        for(const [method,op] of ops){
          if(!op||typeof op!=="object"||!op.responses) continue;
          const tag=(op.tags&&op.tags[0])||"general";
          if(!groups.has(tag)) groups.set(tag,[]);
          groups.get(tag).push({path,method,op});
        }
      }

      // Sidebar
      const side = [`<div class="grp"><div>Get started</div><a class="nav" href="#overview">Overview</a></div>`];
      for(const [tag,list] of groups){
        side.push(`<div class="grp"><div>${esc(tag).replace(/-/g," ")}</div>`+
          list.map(({path,method})=>`<a class="nav" href="#op-${slug(method+path)}"><span class="m m-${method}">${method.toUpperCase()}</span>${esc(path.replace("/api/v1",""))}</a>`).join("")+`</div>`);
      }
      document.getElementById("sidebar").innerHTML = side.join("");

      // Main: overview + groups
      const cards = [...groups.keys()].map(tag=>`<div class="card"><h3>${esc(tag).replace(/-/g," ")}</h3><code>${BASE}/api/v1/${esc(tag.split("-")[0])}</code><p>${esc(GROUP_META[tag]||"")}</p></div>`).join("");
      let idx=0;
      const sections = [...groups.entries()].map(([tag,list])=>
        `<h2 class="group-title" id="grp-${slug(tag)}">${esc(tag).replace(/-/g," ")}</h2><div class="group-desc">Base · <code>${BASE}/api/v1</code></div>`+
        list.map(({path,method,op})=>renderEndpoint(path,method,op,spec,idx++)).join("")
      ).join("");

      document.getElementById("main").innerHTML = `
        <div class="hero" id="overview">
          <div class="eyebrow">${esc(spec.info.title)} · v${esc(spec.info.version)}</div>
          <h1>API Reference</h1>
          <p>${esc(spec.info.description||"")}</p>
          <div class="cards">${cards}</div>
          <div class="ratebar"><b>Base URL</b> <code>${BASE}</code> &nbsp;·&nbsp; <b>Auth</b> send <code>Authorization: Bearer &lt;token&gt;</code> (from <code>/auth/*</code>) or <code>X-API-Key</code>. &nbsp;·&nbsp; <b>Rate limit</b> per key / IP, exponential-backoff friendly.</div>
        </div>
        ${sections}`;
    }).catch(e=>{ document.getElementById("main").innerHTML = `<div class="loading">Could not load openapi.json — ${esc(e.message)}</div>`; });
  </script>
</body>
</html>

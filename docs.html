<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parabola Trading API — Reference</title>
  <meta name="description" content="Interactive reference for the Parabola Trading API — market data, backtesting, strategies, risk-checked execution, and natural-language trading." />
  <style>
    html, body { margin: 0; background: #ffffff; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 11px clamp(1rem, 4vw, 2rem);
      background: #12100a; border-bottom: 1px solid rgba(255,255,255,0.1);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .topbar .brand { display: flex; align-items: center; gap: 9px; color: #ede8d8; font-size: 1.02rem; font-weight: 600; text-decoration: none; }
    .topbar .brand small { font-size: 0.68rem; letter-spacing: 0.12em; color: #c9982a; text-transform: uppercase; font-weight: 700; }
    .topbar .links { display: flex; gap: 10px; align-items: center; }
    .topbar .links a { font-size: 0.82rem; padding: 7px 14px; border-radius: 8px; text-decoration: none; color: #d8cfa8; border: 1px solid rgba(255,255,255,0.16); }
    .topbar .links a.pilot { color: #12100a; background: linear-gradient(135deg, #e8c96a, #c9982a); border: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html">
      <svg width="24" height="24" viewBox="0 0 34 34" fill="none"><path d="M4 28 Q17 4 30 28" stroke="#c9982a" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="17" cy="9.5" r="2.2" fill="#c9982a"/></svg>
      Parabola <small>API Reference</small>
    </a>
    <div class="links">
      <a href="index.html">← Landing</a>
      <a class="pilot" href="https://pilot.parabolamarkets.xyz" target="_blank" rel="noopener">Open the Pilot ↗</a>
    </div>
  </div>

  <div id="redoc"></div>
  <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
  <script>
    // Plain, high-contrast defaults (dark text on white). Only the accent is branded.
    Redoc.init('openapi.json', {
      hideDownloadButton: false,
      expandResponses: '200',
      requiredPropsFirst: true,
      theme: { colors: { primary: { main: '#b8860b' } } },
    }, document.getElementById('redoc'));
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parabola Trading API — Reference</title>
  <meta name="description" content="Interactive reference for the Parabola Trading API — market data, backtesting, strategies, risk-checked execution, and natural-language trading." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose:#c9982a; --rose-bright:#e8c96a; --sand:#b89240; --sand-bright:#d4aa58;
      --bg:#0b0a07; --surface:rgba(255,255,255,0.026); --surface-2:rgba(255,255,255,0.045);
      --border:rgba(255,255,255,0.08); --border-str:rgba(255,255,255,0.16);
      --text:#ede8d8; --text-sec:#9e9278; --text-dim:#5e5438;
      --get:#4ec58a; --post:#e8c96a; --delete:#ef7676; --put:#5aa9e6;
      --nav-h:60px;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:'Syne',system-ui,sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
    a { color:var(--rose-bright); text-decoration:none; }
    code, .mono { font-family:'JetBrains Mono',monospace; }

    /* Top bar */
    .topbar { position:fixed; top:0; left:0; right:0; height:var(--nav-h); z-index:50; display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding:0 clamp(1rem,4vw,2rem); background:rgba(13,12,8,0.9); backdrop-filter:blur(20px) saturate(1.3); border-bottom:1px solid var(--border); }
    .brand { display:flex; align-items:center; gap:10px; color:var(--text); font-family:'Bodoni Moda',Georgia,serif; font-size:1.05rem; font-weight:500; }
    .brand small { font-family:'JetBrains Mono',monospace; font-size:0.64rem; letter-spacing:0.14em; color:var(--rose); text-transform:uppercase; }
    .topbar .links { display:flex; gap:9px; align-items:center; }
    .topbar .links a { font-size:0.8rem; padding:7px 13px; border-radius:9px; color:#d8cfa8; border:1px solid var(--border-str); transition:.15s; }
    .topbar .links a:hover { border-color:var(--rose); }
    .topbar .links a.pilot { color:#0b0a07; background:linear-gradient(135deg,var(--rose-bright),var(--rose)); border:none; font-weight:600; }

    /* Layout */
    .layout { display:grid; grid-template-columns:250px 1fr; max-width:1180px; margin:0 auto; padding-top:var(--nav-h); }
    .sidebar { position:sticky; top:var(--nav-h); align-self:start; height:calc(100vh - var(--nav-h)); overflow-y:auto; padding:22px 10px 60px 0; border-right:1px solid var(--border); }
    .sidebar h4 { margin:16px 8px 6px; font-size:0.66rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--sand); font-weight:700; font-family:'Syne',sans-serif; }
    .sidebar a { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:7px; color:var(--text-sec); font-size:0.8rem; transition:.12s; }
    .sidebar a:hover { background:var(--surface); color:var(--text); }
    .content { padding:34px clamp(1rem,4vw,3rem) 120px; min-width:0; }
    @media (max-width:820px){ .layout{grid-template-columns:1fr} .sidebar{display:none} }

    /* Hero */
    .hero h1 { font-family:'Bodoni Moda',Georgia,serif; font-size:clamp(1.9rem,4vw,2.7rem); font-weight:700; margin:0 0 6px; letter-spacing:-0.01em; }
    .hero .ver { font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--rose); letter-spacing:0.1em; }
    .hero p { color:var(--text-sec); max-width:660px; font-size:0.98rem; margin:10px 0 0; }
    .layers { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
    .layers span { font-size:0.72rem; padding:5px 11px; border-radius:99px; border:1px solid var(--border-str); color:var(--sand-bright); background:var(--surface); }

    .group { margin-top:46px; }
    .group > h2 { font-family:'Bodoni Moda',Georgia,serif; font-size:1.5rem; font-weight:700; margin:0 0 4px; text-transform:capitalize; scroll-margin-top:calc(var(--nav-h) + 14px); }
    .group > .desc { color:var(--text-dim); font-size:0.82rem; margin:0 0 16px; }

    /* Endpoint card */
    .op { border:1px solid var(--border); border-radius:16px; background:var(--surface); margin-bottom:14px; overflow:hidden; scroll-margin-top:calc(var(--nav-h) + 14px); }
    .op-head { display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; }
    .op-head:hover { background:var(--surface-2); }
    .method { flex:0 0 auto; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:0.72rem; letter-spacing:0.05em; padding:5px 9px; border-radius:7px; color:#0b0a07; }
    .m-get{background:var(--get)} .m-post{background:var(--post)} .m-delete{background:var(--delete)} .m-put{background:var(--put)} .m-patch{background:var(--sand-bright)}
    .op-path { font-family:'JetBrains Mono',monospace; font-size:0.86rem; color:var(--text); font-weight:500; word-break:break-all; }
    .op-sum { color:var(--text-sec); font-size:0.82rem; margin-left:auto; text-align:right; max-width:44%; }
    .chev { color:var(--text-dim); transition:transform .18s; flex:0 0 auto; }
    .op.open .chev { transform:rotate(90deg); }
    .op-body { display:none; padding:2px 16px 18px; border-top:1px solid var(--border); }
    .op.open .op-body { display:block; }
    .op-body p.d { color:var(--text-sec); font-size:0.88rem; margin:14px 0 4px; }
    .sec-label { font-size:0.66rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--sand); font-weight:700; margin:18px 0 8px; }
    table { width:100%; border-collapse:collapse; font-size:0.82rem; }
    th { text-align:left; color:var(--text-dim); font-weight:600; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em; padding:6px 10px; border-bottom:1px solid var(--border); }
    td { padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
    td.name { font-family:'JetBrains Mono',monospace; color:var(--text); white-space:nowrap; }
    td .ty { font-family:'JetBrains Mono',monospace; color:var(--sand-bright); font-size:0.78rem; }
    .req { color:var(--delete); font-size:0.66rem; font-weight:700; margin-left:6px; letter-spacing:0.04em; }
    .opt { color:var(--text-dim); font-size:0.66rem; margin-left:6px; }
    .badge-json { display:inline-block; font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:var(--rose-bright); border:1px solid var(--border-str); border-radius:6px; padding:2px 7px; margin-left:8px; }
    .resp { display:flex; gap:10px; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--border); font-size:0.84rem; }
    .status { font-family:'JetBrains Mono',monospace; font-weight:700; }
    .s2{color:var(--get)} .s4{color:var(--post)} .s5{color:var(--delete)}
    .loading { padding:60px 0; text-align:center; color:var(--text-dim); }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html">
      <svg width="24" height="24" viewBox="0 0 34 34" fill="none"><path d="M4 28 Q17 4 30 28" stroke="#c9982a" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="17" cy="9.5" r="2.2" fill="#c9982a"/></svg>
      Parabola <small>API Reference</small>
    </a>
    <div class="links">
      <a href="index.html">← Landing</a>
      <a class="pilot" href="https://pilot.parabolamarkets.xyz" target="_blank" rel="noopener">Open the Pilot ↗</a>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
      <div class="hero" id="hero"></div>
      <div id="groups"><div class="loading">Loading API reference…</div></div>
    </main>
  </div>

  <script>
    const METHOD_ORDER = { get: 0, post: 1, put: 2, patch: 3, delete: 4 };
    const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const slug = (s) => s.replace(/[^a-z0-9]+/gi, "-").toLowerCase();

    function refName(ref) { return ref ? ref.split("/").pop() : null; }

    function typeOf(schema, spec) {
      if (!schema) return "any";
      if (schema.$ref) return refName(schema.$ref);
      if (schema.anyOf || schema.oneOf) {
        const parts = (schema.anyOf || schema.oneOf).map((s) => typeOf(s, spec)).filter((t) => t !== "null");
        return parts.join(" | ") || "any";
      }
      if (schema.allOf) return typeOf(schema.allOf[0], spec);
      if (schema.enum) return schema.enum.map((e) => `"${e}"`).join(" | ");
      if (schema.type === "array") return `${typeOf(schema.items, spec)}[]`;
      return schema.type || "object";
    }

    function resolve(schema, spec) {
      if (!schema) return null;
      if (schema.$ref) return spec.components.schemas[refName(schema.$ref)];
      if (schema.allOf) return resolve(schema.allOf[0], spec);
      return schema;
    }

    function propsTable(schema, spec) {
      const resolved = resolve(schema, spec);
      if (!resolved || !resolved.properties) return "";
      const required = new Set(resolved.required || []);
      const rows = Object.entries(resolved.properties).map(([name, p]) => {
        const desc = p.description || (p.allOf && resolve(p, spec)?.description) || "";
        return `<tr><td class="name">${esc(name)}${required.has(name) ? '<span class="req">required</span>' : '<span class="opt">optional</span>'}</td>
          <td><span class="ty">${esc(typeOf(p, spec))}</span></td><td>${esc(desc)}</td></tr>`;
      }).join("");
      return `<table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function renderOp(path, method, op, spec) {
      const id = "op-" + slug(method + path);
      const params = op.parameters || [];
      let paramsHtml = "";
      if (params.length) {
        const rows = params.map((p) => `<tr><td class="name">${esc(p.name)} <span class="opt">${esc(p.in)}</span>${p.required ? '<span class="req">required</span>' : ""}</td>
          <td><span class="ty">${esc(typeOf(p.schema, spec))}</span></td><td>${esc(p.description || "")}</td></tr>`).join("");
        paramsHtml = `<div class="sec-label">Parameters</div><table><thead><tr><th>Name</th><th>Type</th><th>Description</th></tr></thead><tbody>${rows}</tbody></table>`;
      }
      let bodyHtml = "";
      const bodySchema = op.requestBody?.content?.["application/json"]?.schema;
      if (bodySchema) {
        bodyHtml = `<div class="sec-label">Request body <span class="badge-json">application/json → ${esc(typeOf(bodySchema, spec))}</span></div>${propsTable(bodySchema, spec)}`;
      }
      const respHtml = Object.entries(op.responses || {}).map(([code, r]) => {
        const cls = code[0] === "2" ? "s2" : code[0] === "4" ? "s4" : "s5";
        const sch = r.content?.["application/json"]?.schema;
        const ty = sch ? ` → <span class="ty">${esc(typeOf(sch, spec))}</span>` : "";
        return `<div class="resp"><span class="status ${cls}">${esc(code)}</span><span>${esc(r.description || "")}${ty ? "" : ""}</span><span style="margin-left:auto">${ty}</span></div>`;
      }).join("");

      return `<div class="op" id="${id}">
        <div class="op-head" onclick="this.parentElement.classList.toggle('open')">
          <span class="method m-${method}">${method.toUpperCase()}</span>
          <span class="op-path">${esc(path)}</span>
          <span class="op-sum">${esc(op.summary || "")}</span>
          <span class="chev">›</span>
        </div>
        <div class="op-body">
          ${op.description ? `<p class="d">${esc(op.description)}</p>` : ""}
          ${paramsHtml}${bodyHtml}
          <div class="sec-label">Responses</div>${respHtml}
        </div>
      </div>`;
    }

    fetch("openapi.json").then((r) => r.json()).then((spec) => {
      // Group operations by tag, preserving path order.
      const groups = new Map();
      for (const [path, methods] of Object.entries(spec.paths)) {
        const ops = Object.entries(methods).sort((a, b) => (METHOD_ORDER[a[0]] ?? 9) - (METHOD_ORDER[b[0]] ?? 9));
        for (const [method, op] of ops) {
          if (!op || typeof op !== "object" || !op.responses) continue;
          const tag = (op.tags && op.tags[0]) || "general";
          if (!groups.has(tag)) groups.set(tag, []);
          groups.get(tag).push({ path, method, op });
        }
      }

      document.getElementById("hero").innerHTML = `
        <div class="ver">${esc(spec.info.title)} · v${esc(spec.info.version)}</div>
        <h1>API Reference</h1>
        <p>${esc(spec.info.description || "")}</p>
        <div class="layers">
          <span>Data</span><span>Research / Backtesting</span><span>Strategy</span><span>Execution / Risk</span>
          <span>Verified wallet &amp; JWT identity</span><span>Natural-language trading</span>
        </div>`;

      const sidebar = [];
      const content = [];
      for (const [tag, list] of groups) {
        const gid = "grp-" + slug(tag);
        sidebar.push(`<h4>${esc(tag)}</h4>` + list.map(({ path, method }) =>
          `<a href="#op-${slug(method + path)}"><span class="method m-${method}" style="font-size:0.6rem;padding:2px 6px">${method.toUpperCase()}</span>${esc(path.replace("/api/v1", ""))}</a>`).join(""));
        content.push(`<section class="group" id="${gid}"><h2>${esc(tag).replace(/-/g, " ")}</h2>` +
          list.map(({ path, method, op }) => renderOp(path, method, op, spec)).join("") + `</section>`);
      }
      document.getElementById("sidebar").innerHTML = sidebar.join("");
      document.getElementById("groups").innerHTML = content.join("");
    }).catch((e) => {
      document.getElementById("groups").innerHTML = `<div class="loading">Could not load openapi.json — ${esc(e.message)}</div>`;
    });
  </script>
</body>
</html>
